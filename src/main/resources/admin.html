<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromoApp · Administração</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1b1b1b; --card:#fff; --line:#ddd; --accent:#e85d04; --muted:#666; --bad:#b3261e; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#eee; --card:#1f1f1f; --line:#333; --muted:#aaa; --bad:#f2b8b5; --ok:#7ee2a0; } }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; max-width: 960px; margin-inline: auto; }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
  input, select, textarea, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  input, textarea, select { width: 100%; box-sizing: border-box; margin: 4px 0 8px; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; margin: 2px 4px 2px 0; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; } th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wrap { overflow-x: auto; } .muted { color: var(--muted); } .bad { color: var(--bad); } .ok { color: var(--ok); }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 8px; border-radius: 8px; max-height: 280px; overflow: auto; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>PromoApp · Administração</h1>

<section>
  <h2>Acesso</h2>
  <label>Token de administrador (ADMIN_TOKEN)
    <input id="token" type="password" autocomplete="off" placeholder="cole o token">
  </label>
  <button id="saveToken">Entrar</button>
  <span id="authMsg" class="muted"></span>
</section>

<section>
  <h2>Status</h2>
  <button id="refresh" class="secondary">Atualizar</button>
  <button id="backup" class="secondary">Baixar backup do banco</button>
  <p id="summary" class="muted"></p>
  <div class="wrap"><table id="storesTable"></table></div>
  <h2 style="margin-top:14px">Últimas coletas</h2>
  <div class="wrap"><table id="runsTable"></table></div>
</section>

<section>
  <h2>Coletar agora</h2>
  <div id="collectButtons"></div>
  <pre id="collectOut" hidden></pre>
</section>

<section>
  <h2>Pré-visualizar uma página</h2>
  <p class="muted">Mostra o que o robô acharia na página, sem salvar nada. Use para ajustar o sites.json.</p>
  <input id="pvUrl" type="url" placeholder="https://www.mercadolivre.com.br/ofertas">
  <div class="row">
    <label>Estratégia
      <select id="pvStrategy"><option>auto</option><option>jsonld</option><option>state</option><option>css</option></select>
    </label>
  </div>
  <label>Seletores CSS (JSON, opcional)
    <textarea id="pvCss" rows="5" placeholder='{"item":".poly-card","title":".poly-component__title","price":".poly-price__current","oldPrice":".andes-money-amount--previous"}'></textarea>
  </label>
  <button id="pvRun">Pré-visualizar</button>
  <p id="pvSummary" class="muted"></p>
  <div class="wrap"><table id="pvTable"></table></div>
</section>

<section>
  <h2>Novo cupom</h2>
  <div class="row">
    <input id="cpCode" placeholder="Código (ex.: PROMO10)"><input id="cpStore" placeholder="Loja">
    <input id="cpLabel" placeholder="Desconto (ex.: 10% OFF)"><input id="cpUrl" type="url" placeholder="Link da loja">
  </div>
  <input id="cpDesc" placeholder="Descrição">
  <button id="cpSave">Salvar cupom</button> <span id="cpMsg" class="muted"></span>
</section>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (ms) => ms ? new Date(ms).toLocaleString('pt-BR') : '—';
let token = sessionStorage.getItem('adminToken') || '';
$('token').value = token;

function cell(tr, text, cls) { const td = document.createElement('td'); td.textContent = text ?? ''; if (cls) td.className = cls; tr.appendChild(td); }
function fillTable(table, headers, rows) {
  table.replaceChildren();
  const head = document.createElement('tr'); headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; head.appendChild(th); });
  table.appendChild(head);
  rows.forEach(r => { const tr = document.createElement('tr'); r.forEach(c => cell(tr, c.text, c.cls)); table.appendChild(tr); });
}
async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json', ...(options.headers || {}) } });
  const text = await res.text(); let body; try { body = JSON.parse(text); } catch { body = text; }
  if (!res.ok) throw new Error((body && body.error) || ('Erro ' + res.status));
  return body;
}
async function refresh() {
  try {
    const s = await api('/admin/status');
    $('authMsg').textContent = 'Conectado'; $('authMsg').className = 'ok';
    $('summary').textContent = `${s.active_offers} ofertas ativas · ${s.inactive_offers} expiradas · ${s.user_posts} de usuários · ${s.clicks_24h} cliques em 24 h` + (s.demo_mode ? ' · MODO DEMO' : '');
    fillTable($('storesTable'), ['Loja', 'Ofertas ativas', 'Última vez vista'], s.stores.map(x => [{text: x.store}, {text: x.active_offers}, {text: fmt(x.last_seen_at)}]));
    fillTable($('runsTable'), ['Coletor', 'Quando', 'Lidas', 'Aceitas', 'Novas', 'Atualizadas', 'Expiradas', 'Erro'],
      s.last_runs.map(r => [{text: r.collector}, {text: fmt(r.started_at)}, {text: r.fetched}, {text: r.accepted}, {text: r.inserted}, {text: r.updated}, {text: r.expired}, {text: r.error || 'ok', cls: r.error ? 'bad' : 'ok'}]));
    const box = $('collectButtons'); box.replaceChildren();
    [null, ...s.collectors].forEach(name => {
      const b = document.createElement('button'); b.textContent = name ? 'Coletar ' + name : 'Coletar tudo'; if (name) b.className = 'secondary';
      b.onclick = () => collect(name); box.appendChild(b);
    });
  } catch (e) { $('authMsg').textContent = e.message; $('authMsg').className = 'bad'; }
}
async function collect(name) {
  const out = $('collectOut'); out.hidden = false; out.textContent = 'Coletando…';
  try { out.textContent = JSON.stringify(await api('/admin/collect' + (name ? '?store=' + encodeURIComponent(name) : ''), { method: 'POST' }), null, 2); refresh(); }
  catch (e) { out.textContent = e.message; }
}
async function preview() {
  $('pvSummary').textContent = 'Lendo a página…'; $('pvTable').replaceChildren();
  try {
    const body = { url: $('pvUrl').value.trim(), strategy: $('pvStrategy').value };
    const css = $('pvCss').value.trim(); if (css) body.css = JSON.parse(css);
    const r = await api('/admin/scrape-preview', { method: 'POST', body: JSON.stringify(body) });
    $('pvSummary').textContent = `Estratégia: ${r.strategy} · ${r.found} produtos · ${r.with_discount} com desconto` + (r.warnings.length ? ' · ' + r.warnings.join(' ') : '');
    fillTable($('pvTable'), ['Título', 'Preço', 'Preço de', 'Desc.', 'Link'], r.sample.map(p => [{text: p.title}, {text: p.price}, {text: p.original_price ?? '—'}, {text: p.discount_percent + '%'}, {text: p.url}]));
  } catch (e) { $('pvSummary').textContent = e.message; $('pvSummary').className = 'bad'; }
}
async function saveCoupon() {
  try {
    await api('/admin/coupons', { method: 'POST', body: JSON.stringify({ code: $('cpCode').value, store: $('cpStore').value, description: $('cpDesc').value, discount_label: $('cpLabel').value, url: $('cpUrl').value }) });
    $('cpMsg').textContent = 'Cupom salvo'; $('cpMsg').className = 'ok';
  } catch (e) { $('cpMsg').textContent = e.message; $('cpMsg').className = 'bad'; }
}
async function backup() {
  try {
    const res = await fetch('/admin/backup', { headers: { 'X-Admin-Token': token } });
    if (!res.ok) throw new Error('Erro ' + res.status);
    const blob = await res.blob(); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'promo-backup-' + new Date().toISOString().slice(0, 10) + '.db';
    a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { $('authMsg').textContent = e.message; $('authMsg').className = 'bad'; }
}
$('backup').onclick = backup;
$('saveToken').onclick = () => { token = $('token').value; sessionStorage.setItem('adminToken', token); refresh(); };
$('refresh').onclick = refresh; $('pvRun').onclick = preview; $('cpSave').onclick = saveCoupon;
if (token) refresh();
</script>
</body>
</html>

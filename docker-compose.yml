# Servidor + HTTPS automático (Caddy). Defina DOMAIN, ADMIN_TOKEN e as credenciais num arquivo .env ao lado deste.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/promo.db
      TRUST_PROXY: "true"
      PUBLIC_BASE_URL: https://${DOMAIN}
    volumes:
      - promo-data:/data
      - ./sites.json:/app/sites.json:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  promo-data:
  caddy-data:
